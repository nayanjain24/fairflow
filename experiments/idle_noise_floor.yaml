# FairFlow Scenario: 60s Idle Noise Floor
# Emulated testbed topology: client ns <-> router ns <-> server ns
# Hardware behaviour: software emulation via Linux network namespaces and veth pairs.

scenario_name: "idle_noise_floor"
duration_seconds: 60

namespaces:
  client: "ff_client"
  router: "ff_router"
  server: "ff_server"

links:
  lan:
    endpoint_a:
      namespace: "ff_client"
      interface: "ff_c_lan"
      ip: "10.0.1.2/24"
    endpoint_b:
      namespace: "ff_router"
      interface: "ff_r_lan"
      ip: "10.0.1.1/24"
  wan:
    endpoint_a:
      namespace: "ff_router"
      interface: "ff_r_wan"
      ip: "10.0.2.1/24"
    endpoint_b:
      namespace: "ff_server"
      interface: "ff_s_wan"
      ip: "10.0.2.2/24"

routes:
  - namespace: "ff_client"
    destination: "10.0.2.0/24"
    gateway: "10.0.1.1"
  - namespace: "ff_server"
    destination: "10.0.1.0/24"
    gateway: "10.0.2.1"

# In the idle baseline, no synthetic impairments or shaping are applied.
impairments: {}
